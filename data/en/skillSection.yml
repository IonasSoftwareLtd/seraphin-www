topTitle: Features

sensorManagement:
  - subtitle: Features
    content: >
      ### Sensor management

      Browse through your sensors and access the collected data through the portal. 
      It's a convenient way to remotely monitor your assets whether you manage only a handful or hundreds of them.  
        

      The portal gives you the ability to organise your sensors into meaningful categories. 
      You may want to group them according to their physical location, type, or purpose. 
      It is easy to move sensors between these groups customising the views according to personal preferences.  
        

      Zooming in on a specific sensor uncovers the latest data gathered throughout the day. 
      The data is plotted on a line chart for easy insight and clear presentation. 
      In addition, all historical data is at your fingertips, available for browsing as an easy to view and pageable table.

ruleEvaluation:
  - subtitle: 
    content: >
      ### Event rule evaluation ###

      Rules are at the core of the platform. Every incoming telemetry event that the platform receives is checked against them, 
      and result determines whether an alert should be triggered. You can create any number and tailor them to the different 
      telemetry data your sensors can send.  
        
      A typical rule definition follows an industry recognised pattern of ‘For…, When…, Then’. 
      For example: for a particular sensor measuring temperature, when the reading drops below a specified value, 
      then contact people on the list. This easily understood rule pattern can be readily transformed 
      to an extremely performant condition evaluation routine that is guaranteed to carry minimal 
      footprint for the computing resources required to execute the rule.  
        

      Performance is important because The Seraphin IoT Monitoring and Telemetry Platform places 
      no restrictions on the number of rules you define. Some of the rules you create will require 
      immediate activation, some will be used only for testing and may or may not be eventually 
      enabled in your production environment. The online portal makes it easy to browse through all 
      rules you have defined, test each one in isolation and finally stage for production deployment 
      or keep them in testing.  
        

      As an owner of an organisation onboarded onto the Seraphin Monitoring Platform you have the ability 
      to grant multiple users admin access to your organisation. This will give them the ability to look 
      at your data and view alert triggering rules you defined. 

alertManagement:
  - subtitle: 
    content: >
      ### Alert management ###

      The portal makes it easy to get an overview of all alerts that the system has initiated. 
      You can easily access all information related to the context in which the alert was trigerred. 
      This includes view into the telemetry event that coused the alert to fire, 
      rule criteria that the telemetry event has met, and all people in your organisation 
      that have been selected as a point of contact.  
        
        
      Only rules that meet the criteria you define can trigger notification alerts. 
      Use the portal to inspect rules that resulted in notification attempts. 
      A complete log of all activated rules for every telemetry event 
      that your sensors transit is always available for total transparency.
