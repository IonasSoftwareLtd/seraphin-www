---
enable: true
topTitle: Łączność
title: >
  ## Obsługiwane protokoły

  Platforma telemetryczna Seraphin IoT może współpracować z różnymi urządzeniami obsługującymi
  różne standardy łączności IoT
service:
  - content: >
      #### LoRaWAN

      Platforma Seraphin IoT została zaprojektowana do współpracy z prywatnymi sieciami LoRaWAN
      obsługując najnowsze protokoły specyfikacji LoRaWAN.

    image: images/service/lorawan200x65.png
  - content: >
      #### NB-IoT

      NB-IoT zyskuje coraz większy zasięg, a platformę Seraphin IoT można skonfigurować tak, aby
      do obsługi urządzeń obsługujących NB-IoT przy użyciu transportów **UDP**, **CoAP** lub **MQTT**.

    image: images/service/nbiot200x74.png
  - content: >
      #### Wi-Fi

      Platformę Seraphin IoT można łatwo rozszerzyć do odbierania danych przez **REST** lub **SOAP** - 
      API usług sieciowych lub protokołów zorientowanych na wiadomości, takich jak **MQTT**.

    image: images/service/wifi143x80.png
